name: permit-desk

x-bus-env: &bus-env
  KAFKA_BROKERS: kafka:9092
  KAFKA_CLIENT_ID: permit-desk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: permitdesk
      POSTGRES_PASSWORD: permitdesk
      POSTGRES_DB: permitdesk_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitdesk -d permitdesk_development"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: mountport-dev-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    build:
      context: ./api
      args:
        PORTAL_TOKEN_SECRET: 6f2a91c4bd7e40398a1cf5b2e8d4c7a9
    environment:
      <<: *bus-env
      DATABASE_URL: postgres://permitdesk:permitdesk@db:5432/permitdesk_development
      ZONING_URL: http://zoning:4010
      REVIEW_URL: http://review:4020
      SCHEDULING_URL: http://scheduling:4030
      CASHIERING_URL: http://cashiering:4040
      PORTAL_BASE_URL: http://localhost:8088
    deploy:
      replicas: 2
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }

  bus-worker:
    build:
      context: ./api
      args:
        PORTAL_TOKEN_SECRET: 6f2a91c4bd7e40398a1cf5b2e8d4c7a9
    command: ["bin/bus_worker"]
    environment:
      <<: *bus-env
      DATABASE_URL: postgres://permitdesk:permitdesk@db:5432/permitdesk_development
      ZONING_URL: http://zoning:4010
      REVIEW_URL: http://review:4020
      SCHEDULING_URL: http://scheduling:4030
      CASHIERING_URL: http://cashiering:4040
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }

  web:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  zoning:
    build: ./services
    command: ["node", "zoning/index.js"]
    environment:
      <<: *bus-env
      PORT: 4010
      PERMIT_DESK_URL: http://api:3000
    depends_on:
      kafka: { condition: service_healthy }

  review:
    build: ./services
    command: ["node", "review/index.js"]
    environment:
      <<: *bus-env
      PORT: 4020
    depends_on:
      kafka: { condition: service_healthy }

  scheduling:
    build: ./services
    command: ["node", "scheduling/index.js"]
    environment:
      <<: *bus-env
      PORT: 4030
    depends_on:
      kafka: { condition: service_healthy }

  cashiering:
    build: ./services
    command: ["node", "cashiering/index.js"]
    environment:
      <<: *bus-env
      PORT: 4040
      PERMIT_DESK_URL: http://api:3000
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  pgdata:
